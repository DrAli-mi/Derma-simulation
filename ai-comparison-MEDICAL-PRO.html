<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Intelligence — Claude · Gemini · ChatGPT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Rajdhani:wght@600;700&display=swap');

  :root{
    --bg:#040404;
    --bg2:#0b0507;
    --panel:#170a0e;
    --panel2:#1f0c11;
    --ink:#f3ece8;
    --muted:#a3888c;
    --accent:#c81e3a;
    --accent2:#ff3b57;
    --line:rgba(200,30,58,.28);
    --claude:#e08a63;
    --gemini:#5b9dff;
    --gpt:#3ddcb0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#000;font-family:'Tajawal',sans-serif;color:var(--ink);}
  .num,.eng{font-family:'Rajdhani',sans-serif;}
  .frame{max-width:1060px;margin:0 auto;padding:26px 16px 44px;}

  /* ===================== STAGE ===================== */
  .stage{
    position:relative;width:100%;aspect-ratio:16/9;
    background:
      radial-gradient(ellipse 55% 45% at 18% 12%, rgba(200,30,58,.16), transparent 60%),
      radial-gradient(ellipse 50% 50% at 88% 90%, rgba(200,30,58,.14), transparent 60%),
      linear-gradient(160deg, var(--bg2), var(--bg));
    border-radius:20px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(200,30,58,.35), 0 30px 80px -20px rgba(0,0,0,.8), 0 0 60px -10px rgba(200,30,58,.25);
  }

  /* circuit texture */
  .circuit-bg{position:absolute;inset:0;opacity:.16;pointer-events:none;}
  .node{position:absolute;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px 2px rgba(255,59,87,.7);
    animation:pulse 3.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(1);}50%{opacity:.9;transform:scale(1.4);}}
  .drift{animation:drift 22s ease-in-out infinite alternate;}
  @keyframes drift{to{transform:translate(14px,-10px);}}

  .wm{position:absolute;bottom:3%;left:3%;width:34px;height:34px;opacity:.5;z-index:6;filter:drop-shadow(0 0 6px rgba(200,30,58,.6));}
  .wm img{width:100%;display:block;}

  .chrome{position:absolute;top:0;left:0;right:0;padding:4% 5% 0;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .chapter-tag{display:flex;align-items:center;gap:8px;font-size:clamp(9px,1.4vw,11.5px);font-weight:800;color:var(--accent2);letter-spacing:.4px;}
  .chapter-tag .bar{width:16px;height:2px;background:var(--accent2);}
  .brandmark{display:flex;align-items:center;gap:6px;font-size:clamp(9px,1.4vw,11px);font-weight:700;color:var(--muted);}
  .brandmark img{width:16px;height:16px;opacity:.85;}

  .progress-track{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.06);z-index:6;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px var(--accent2);}

  /* scanline transition flourish */
  .scan{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;}
  .scan.play{animation:scanSweep .55s cubic-bezier(.3,0,.2,1);}
  .scan::after{content:"";position:absolute;top:0;bottom:0;width:26%;
    background:linear-gradient(90deg,transparent,rgba(255,59,87,.55),transparent);
    transform:translateX(-140%);}
  .scan.play::after{animation:scanMove .55s cubic-bezier(.3,0,.2,1);}
  @keyframes scanSweep{0%{opacity:1;}100%{opacity:0;}}
  @keyframes scanMove{to{transform:translateX(480%);}}

  .slide{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:6% 6% 4%;
    opacity:0;filter:blur(6px);
    transform:scale(.96) translateY(10px) translateX(0);
    pointer-events:none;transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1),filter .5s;
  }
  /* per-slide entrance variety (resting/off-stage position, before becoming active) */
  .slide[data-enter="zoomPunch"]{transform:scale(1.16) translateY(0) translateX(0);}
  .slide[data-enter="slideL"]{transform:scale(.97) translateY(0) translateX(-70px);}
  .slide[data-enter="slideR"]{transform:scale(.97) translateY(0) translateX(70px);}
  .slide[data-enter="dropIn"]{transform:scale(.97) translateY(-50px) translateX(0);}
  .slide[data-enter="riseIn"]{transform:scale(.97) translateY(46px) translateX(0);}
  /* active always resolves to centered, regardless of entrance variant (higher specificity wins over data-enter) */
  div.slide.active{opacity:1;transform:scale(1) translateY(0) translateX(0);filter:blur(0);pointer-events:auto;}

  .eyebrow{display:flex;align-items:center;gap:8px;font-size:clamp(11px,1.7vw,14px);font-weight:800;letter-spacing:.4px;color:var(--accent2);margin-bottom:12px;}
  .eyebrow .ring{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent2);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--accent2);}

  .title{font-size:clamp(23px,3.9vw,38px);font-weight:800;text-align:center;margin:0 0 3.2%;line-height:1.4;}
  .title .hl{position:relative;color:var(--ink);white-space:nowrap;}
  .title .hl::after{content:"";position:absolute;right:-3%;left:-3%;bottom:6%;height:32%;background:rgba(200,30,58,.5);border-radius:5px;z-index:-1;transform:scaleX(0);transform-origin:right;animation:markIn .5s cubic-bezier(.2,.9,.3,1) forwards;animation-delay:.5s;}
  .title small{display:block;font-size:clamp(13px,2vw,17px);font-weight:500;color:var(--muted);margin-top:12px;}
  @keyframes markIn{to{transform:scaleX(1);}}
  .word{display:inline-block;opacity:0;transform:translateY(14px);animation:wordUp .5s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes wordUp{to{opacity:1;transform:translateY(0);}}

  .badge{width:30px;height:30px;flex-shrink:0;}

  .row{display:flex;gap:2.4%;width:100%;justify-content:center;}
  .col-card{
    flex:1;max-width:32%;background:linear-gradient(160deg,var(--panel2),var(--panel));
    border-radius:16px;padding:5% 3.4%;text-align:center;
    border:1px solid var(--line);
    box-shadow:0 2px 4px rgba(0,0,0,.3), 0 18px 30px -14px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03);
    opacity:0;transform:translateY(22px) scale(.94);
    animation:cardIn .6s cubic-bezier(.2,1.1,.3,1) forwards;
  }
  .brand-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px;}
  .col-card .logo{font-size:clamp(16px,2.5vw,21px);font-weight:800;}
  .col-card .tag{font-size:clamp(11px,1.6vw,13px);color:var(--muted);margin:2px 0 12px;font-weight:600;}
  .col-card ul{list-style:none;margin:0;padding:0;text-align:right;}
  .col-card li{font-size:clamp(11.5px,1.9vw,14.5px);line-height:1.7;margin-bottom:8px;padding-right:17px;position:relative;color:#e9e0dc;}
  .col-card li::before{content:"";position:absolute;right:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent2);box-shadow:0 0 4px var(--accent2);}
  .col-card .stat{font-family:'Rajdhani',sans-serif;font-size:clamp(26px,3.9vw,36px);font-weight:700;color:#fff;margin:8px 0 1px;letter-spacing:.5px;}
  .col-card .stat-label{font-size:clamp(10px,1.5vw,12px);color:var(--muted);margin-bottom:10px;line-height:1.45;}
  .divider{width:32px;height:2px;background:var(--line);margin:8px auto;border-radius:2px;}

  .chips{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;max-width:700px;}
  .chip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 17px;font-size:clamp(12px,1.9vw,15px);font-weight:700;box-shadow:0 8px 18px -10px rgba(0,0,0,.6);opacity:0;transform:translateY(12px);animation:cardIn .5s cubic-bezier(.2,1.1,.3,1) forwards;}
  .chip .idx{width:19px;height:19px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Rajdhani',sans-serif;}

  .big-stat{font-family:'Rajdhani',sans-serif;font-size:clamp(54px,10vw,104px);font-weight:700;color:#fff;line-height:1;letter-spacing:1px;text-shadow:0 0 30px rgba(200,30,58,.6);}
  .big-stat-label{font-size:clamp(13px,2.1vw,16px);color:var(--muted);font-weight:700;margin-top:10px;}
  .logo-row{display:flex;gap:28px;margin-top:22px;align-items:center;}
  .logo-row .item{display:flex;align-items:center;gap:6px;font-size:clamp(12px,2vw,15px);font-weight:800;opacity:0;animation:cardIn .5s ease forwards;}

  .price-card .price{font-family:'Rajdhani',sans-serif;font-size:clamp(24px,3.8vw,32px);font-weight:700;color:#fff;margin-bottom:1px;}
  .price-card .price sup{font-family:'Tajawal',sans-serif;font-size:14px;color:var(--muted);font-weight:600;}

  .footnote{position:absolute;bottom:3.2%;font-size:clamp(9.5px,1.35vw,11.5px);color:var(--muted);opacity:0;animation:fadeIn .5s ease forwards;animation-delay:.7s;max-width:88%;text-align:center;left:6%;right:6%;}
  .alert-box{background:rgba(200,30,58,.14);border:1.5px solid var(--accent2);border-radius:16px;padding:5% 6%;max-width:640px;text-align:center;opacity:0;transform:scale(.92);animation:cardIn .5s cubic-bezier(.2,1.1,.3,1) forwards;animation-delay:.3s;}
  .alert-box .icon{font-size:clamp(26px,4vw,36px);margin-bottom:10px;}
  .alert-box p{font-size:clamp(14px,2.2vw,18px);line-height:1.8;font-weight:700;margin:0;color:#fff;}
  @keyframes fadeIn{to{opacity:1;}}

  .verdict-row{display:flex;flex-direction:column;gap:9px;width:100%;max-width:640px;}
  .verdict-item{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;padding:12px 18px;box-shadow:0 10px 22px -14px rgba(0,0,0,.6);border:1px solid var(--line);opacity:0;transform:translateX(16px);animation:cardIn .5s cubic-bezier(.2,1.1,.3,1) forwards;}
  .verdict-item .who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(14px,2.4vw,18px);min-width:130px;}
  .verdict-item .why{font-size:clamp(13px,2.1vw,16px);color:#e9e0dc;line-height:1.6;}

  @keyframes cardIn{to{opacity:1;transform:translateY(0) translateX(0) scale(1);}}

  /* timeline */
  .timeline{display:flex;align-items:flex-start;justify-content:center;gap:0;width:100%;max-width:720px;margin-top:10px;}
  .tl-item{flex:1;text-align:center;position:relative;opacity:0;animation:cardIn .5s ease forwards;}
  .tl-dot{width:14px;height:14px;border-radius:50%;background:var(--accent2);margin:0 auto 10px;box-shadow:0 0 10px var(--accent2);position:relative;z-index:2;}
  .tl-line{position:absolute;top:6px;right:50%;width:100%;height:2px;background:var(--line);z-index:1;}
  .tl-item:first-child .tl-line{display:none;}
  .tl-year{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(15px,2.6vw,20px);color:#fff;margin-bottom:4px;}
  .tl-txt{font-size:clamp(11px,1.9vw,14px);color:var(--muted);line-height:1.5;padding:0 4px;}

  /* flow diagram */
  .flow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;flex-wrap:wrap;max-width:760px;}
  .flow-step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:clamp(12px,2vw,15px);font-weight:700;text-align:center;opacity:0;animation:cardIn .5s ease forwards;box-shadow:0 8px 16px -10px rgba(0,0,0,.6);}
  .flow-arrow{color:var(--accent2);font-size:18px;opacity:0;animation:fadeIn .4s ease forwards;}

  /* recap table */
  .recap{width:100%;max-width:760px;border-collapse:collapse;font-size:clamp(12px,1.9vw,15px);}
  .recap th,.recap td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);}
  .recap th{font-weight:800;color:var(--muted);font-size:clamp(11px,1.7vw,13.5px);}
  .recap td:first-child, .recap th:first-child{text-align:right;font-weight:700;color:#e9e0dc;}
  .recap tr{opacity:0;animation:cardIn .4s ease forwards;}
  .pip{display:inline-block;width:11px;height:11px;border-radius:50%;}

  /* divider slide */
  .divider-slide{align-items:center;justify-content:center;}
  .div-num{font-family:'Rajdhani',sans-serif;font-size:clamp(48px,8vw,84px);font-weight:700;color:var(--accent2);opacity:.9;text-shadow:0 0 40px rgba(200,30,58,.5);line-height:1;}
  .div-title{font-size:clamp(20px,3.6vw,34px);font-weight:800;margin-top:10px;text-align:center;}
  .div-rule{width:60px;height:2px;background:var(--accent2);margin:16px auto;box-shadow:0 0 8px var(--accent2);}

  .logo-hero{width:clamp(90px,16vw,150px);filter:drop-shadow(0 0 30px rgba(200,30,58,.55));margin-bottom:4%;}

  @media (max-width:600px){
    .col-card li{font-size:10px;}
  }

  /* ===================== CONTROLS ===================== */
  .controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px;}
  .nav-btn{background:#0f0709;border:1px solid var(--line);border-radius:12px;padding:10px 22px;font-family:'Tajawal',sans-serif;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:.15s;}
  .nav-btn:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-1px);}
  .nav-btn:disabled{opacity:.3;cursor:default;transform:none;}
  .icon-btn{width:38px;height:38px;border-radius:50%;background:#0f0709;border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.4);}
  .icon-btn svg{width:16px;height:16px;}
  .slidecounter{font-family:'Rajdhani',sans-serif;font-size:13px;color:var(--muted);font-weight:700;min-width:52px;text-align:center;}

  /* ===================== EXTRA MOTION LAYER ===================== */
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}
  .slide{z-index:2;}
  /* independent `translate`/`scale` props so they never fight the entrance transforms */
  @keyframes floaty{0%,100%{translate:0 0;}50%{translate:0 -7px;}}
  @keyframes glowPulse{0%,100%{box-shadow:0 2px 4px rgba(0,0,0,.3),0 18px 30px -14px rgba(0,0,0,.6),0 0 0 rgba(255,59,87,0);}50%{box-shadow:0 2px 4px rgba(0,0,0,.3),0 18px 30px -14px rgba(0,0,0,.6),0 0 26px rgba(255,59,87,.28);}}
  @keyframes shimmer{to{background-position:-200% 0;}}
  @keyframes textGlow{0%,100%{text-shadow:0 0 22px rgba(200,30,58,.45);}50%{text-shadow:0 0 46px rgba(255,59,87,.95),0 0 90px rgba(200,30,58,.4);}}
  @keyframes logoSpin{to{rotate:360deg;}}
  @keyframes ping{0%{transform:scale(1);opacity:.8;}100%{transform:scale(3.2);opacity:0;}}
  @keyframes liIn{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}
  @keyframes lineGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
  @keyframes pop{0%{scale:0;}70%{scale:1.5;}100%{scale:1;}}
  @keyframes breathe{0%,100%{scale:1;}50%{scale:1.05;}}
  @keyframes sweepBorder{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  .active .col-card{animation:cardIn .6s cubic-bezier(.2,1.1,.3,1) forwards, floaty 5s ease-in-out 1.2s infinite, glowPulse 4s ease-in-out 1.2s infinite;}
  .active .col-card:nth-child(2){animation-duration:.6s,5.6s,4.6s;}
  .active .col-card:nth-child(3){animation-duration:.6s,6.2s,5.2s;}
  .col-card{transition:scale .3s ease, border-color .3s;}
  .col-card:hover{scale:1.045;border-color:var(--accent2);}
  .col-card li{opacity:0;animation:liIn .5s cubic-bezier(.2,1,.3,1) forwards;}
  .active .verdict-item,.active .chip,.active .flow-step{transition:scale .25s;}
  .verdict-item:hover,.chip:hover,.flow-step:hover{scale:1.04;}
  .active .chip{animation:cardIn .5s ease forwards, floaty 4.5s ease-in-out 1s infinite;}
  .active .chip:nth-child(even){animation-duration:.5s,5.5s;}
  .active .alert-box{animation:cardIn .5s cubic-bezier(.2,1.1,.3,1) forwards, breathe 2.6s ease-in-out .8s infinite;}
  .active .alert-box .icon{display:inline-block;animation:breathe 1.2s ease-in-out infinite;}
  .active .big-stat{animation:textGlow 2.8s ease-in-out infinite;}
  .active .logo-hero{animation:floaty 4s ease-in-out infinite, breathe 5s ease-in-out infinite;}
  .active .badge{animation:breathe 3s ease-in-out infinite;}
  .active .col-card .stat{animation:textGlow 3.2s ease-in-out infinite;}
  .active .tl-line{transform-origin:right;animation:lineGrow .6s ease both;animation-delay:inherit;}
  .tl-dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent2);animation:ping 2s ease-out infinite;}
  .active .pip{animation:pop .5s cubic-bezier(.2,1.4,.3,1) both;animation-delay:.5s;}
  .active .flow-arrow{animation:fadeIn .4s ease forwards, floaty 1.4s ease-in-out infinite;}
  .active .div-num{background:linear-gradient(90deg,var(--accent2),#fff,var(--accent2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite;}
  .active .div-rule{animation:lineGrow .7s .3s ease both;}
  .progress-fill{background:linear-gradient(90deg,var(--accent),var(--accent2),#ffb3bf,var(--accent2),var(--accent));background-size:200% 100%;animation:shimmer 2.5s linear infinite;}
  .stage::after{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:9;padding:1.5px;
    background:linear-gradient(110deg,transparent 30%,rgba(255,59,87,.9) 50%,transparent 70%) 0 0/200% 100%;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sweepBorder 5s linear infinite;}
  .nav-btn,.icon-btn{position:relative;overflow:hidden;transition:transform .15s,border-color .2s,color .2s;}
  .nav-btn:active,.icon-btn:active{transform:scale(.93);}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,59,87,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none;}
  @keyframes rip{to{transform:scale(4);opacity:0;}}
  .nav-btn:not(:disabled).pulse{animation:glowPulse 1.6s infinite;}
  #autoBtn.on{border-color:var(--accent2);box-shadow:0 0 14px rgba(255,59,87,.5);}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;}#fx{display:none;}}

  /* ===================== MOTION GRAPHICS LAYER ===================== */
  .slide:not(.active) *,.slide:not(.active) *::before,.slide:not(.active) *::after{animation-play-state:paused!important;}
  /* mouse spotlight */
  .stage::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(380px circle at var(--mx,50%) var(--my,35%),rgba(255,59,87,.11),transparent 62%);}
  /* slow camera push on the active slide */
  @keyframes kenburns{from{scale:1;}to{scale:1.035;}}
  div.slide.active{animation:kenburns 16s ease-out forwards;}
  /* persistent ECG heartbeat line */
  .ecg{position:absolute;left:0;right:0;bottom:6%;height:9%;width:100%;z-index:1;pointer-events:none;opacity:.45;}
  .ecg path{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;}
  .ecg .base{stroke:rgba(255,59,87,.14);stroke-width:1.5;}
  .ecg .beam{stroke:#ff3b57;stroke-width:2.4;stroke-dasharray:9 91;filter:drop-shadow(0 0 5px #ff3b57);animation:ecgRun 4.6s linear infinite;}
  @keyframes ecgRun{from{stroke-dashoffset:0;}to{stroke-dashoffset:-100;}}
  /* shutter wipe between slides */
  .wipe{position:absolute;inset:0;z-index:8;pointer-events:none;display:flex;}
  .wipe i{flex:1;background:linear-gradient(180deg,#c81e3a,#3a0812);transform:scaleY(0);}
  .wipe.play i{animation:wipeBar .75s cubic-bezier(.7,0,.3,1);animation-delay:calc(var(--k)*45ms);}
  @keyframes wipeBar{0%{transform:scaleY(0);transform-origin:top;}45%{transform:scaleY(1);transform-origin:top;}55%{transform:scaleY(1);transform-origin:bottom;}100%{transform:scaleY(0);transform-origin:bottom;}}
  /* chapter tag slide-in */
  .chapter-tag.swap{animation:tagIn .6s cubic-bezier(.2,1,.3,1);}
  @keyframes tagIn{from{opacity:0;translate:26px 0;}to{opacity:1;translate:0 0;}}
  /* neural network backdrop */
  .neural{position:absolute;inset:0;width:100%;height:100%;opacity:.17;pointer-events:none;z-index:-1;}
  .neural .ne{stroke:rgba(255,59,87,.42);stroke-width:1;stroke-dasharray:6 14;animation:dashMove 3.2s linear infinite;}
  .neural .nn{fill:#ff3b57;transform-box:fill-box;transform-origin:center;animation:nodePulse 2.6s ease-in-out infinite;}
  @keyframes dashMove{to{stroke-dashoffset:-40;}}
  @keyframes nodePulse{0%,100%{scale:.6;opacity:.4;}50%{scale:1.7;opacity:1;}}
  /* orbiting logos around hero mark */
  .orbit-wrap{position:relative;width:clamp(90px,16vw,150px);margin-bottom:4%;}
  .orbit-wrap .logo-hero{width:100%;margin:0;display:block;position:relative;z-index:1;}
  .orbit-wrap .ell{position:absolute;left:50%;top:50%;width:190%;height:56%;translate:-50% -50%;border:1px dashed rgba(255,59,87,.4);border-radius:50%;}
  .orbit-wrap .sat{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:0;filter:drop-shadow(0 0 8px rgba(255,255,255,.25));}
  .orbit-wrap .sat .badge{width:100%;height:100%;animation:none;}
  /* divider rings */
  .rings{position:absolute;inset:0;pointer-events:none;}
  .rings i{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border:1.5px solid rgba(255,59,87,.55);border-radius:50%;animation:ringOut 3.6s ease-out infinite;opacity:0;}
  .rings i:nth-child(2){animation-delay:1.2s;}.rings i:nth-child(3){animation-delay:2.4s;}
  @keyframes ringOut{0%{scale:.4;opacity:.9;}100%{scale:4.2;opacity:0;}}
  /* gauges (HealthBench) */
  .gauge{position:relative;width:clamp(96px,14vw,132px);aspect-ratio:1;margin:4px auto 6px;}
  .gauge svg{width:100%;height:100%;rotate:-90deg;overflow:visible;}
  .gauge .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:9;}
  .gauge .fillc{fill:none;stroke-width:9;stroke-linecap:round;stroke-dasharray:0 100;filter:drop-shadow(0 0 6px currentColor);animation:gaugeFill 1.5s cubic-bezier(.2,.9,.2,1) .5s forwards;}
  @keyframes gaugeFill{to{stroke-dasharray:var(--v) 100;}}
  .gauge .stat{position:absolute;inset:0;margin:0!important;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vw,28px)!important;animation:none!important;}
  /* accuracy bars (image slide) */
  .mval{direction:ltr;font-family:'Rajdhani',sans-serif;font-size:clamp(26px,3.9vw,36px);font-weight:700;margin-top:10px;color:#fff;}
  .mval.approx::before{content:"~";}
  .mbar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden;}
  .mbar i{display:block;height:100%;border-radius:8px;background:var(--c);box-shadow:0 0 12px var(--c);transform-origin:right;transform:scaleX(0);animation:barGrow 1.3s cubic-bezier(.2,.9,.2,1) .55s forwards;}
  @keyframes barGrow{to{transform:scaleX(var(--v));}}
  /* flow steps: energy pulse travelling left→right (RTL: right→left) */
  .flow-step{position:relative;}
  .flow-step::after{content:"";position:absolute;inset:-1px;border-radius:12px;border:1.5px solid var(--accent2);box-shadow:0 0 16px rgba(255,59,87,.6);opacity:0;animation:stepPing 3s ease-in-out infinite;}
  .flow-step:nth-child(1)::after{animation-delay:.8s;}.flow-step:nth-child(3)::after{animation-delay:1.6s;}.flow-step:nth-child(5)::after{animation-delay:2.4s;}
  @keyframes stepPing{0%,30%,100%{opacity:0;}12%{opacity:1;}}
  /* alert radar */
  .alert-box{position:relative;overflow:visible;}
  .radar{position:absolute;left:50%;top:50%;pointer-events:none;}
  .radar i{position:absolute;width:70px;height:70px;margin:-35px 0 0 -35px;border:2px solid rgba(255,59,87,.7);border-radius:50%;opacity:0;animation:radarOut 2.4s ease-out infinite;}
  @keyframes radarOut{0%{scale:.6;opacity:.9;}100%{scale:3.6;opacity:0;}}
  .radar i:nth-child(2){animation-delay:.8s;}.radar i:nth-child(3){animation-delay:1.6s;}
  .active .alert-box .icon{animation:shake 1.6s ease-in-out infinite!important;}
  @keyframes shake{0%,60%,100%{rotate:0deg;}10%,30%,50%{rotate:-9deg;}20%,40%{rotate:9deg;}}
  /* recap: scanning row + winner glow */
  .recap td{animation:rowHot 9.6s linear infinite;animation-delay:var(--d,0s);}
  @keyframes rowHot{0%,9%{background:rgba(200,30,58,.22);}10%,100%{background:transparent;}}
  .active .pip[data-w="1"]{box-shadow:0 0 8px var(--accent2);}
  /* verdict: sweeping accent line + spinning logos */
  .verdict-item{position:relative;overflow:hidden;}
  .verdict-item::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent2),transparent);transform:scaleX(0);animation:lineGrow 1.1s ease .6s forwards;}
  .verdict-item .badge{animation:logoSpin 14s linear infinite!important;}
</style>
</head>

/* ============ AUDIO (synthesised) ============ */
let actx=null, muted=false;
function ctx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function whoosh(){
  if(muted) return;
  const c=ctx(); const t0=c.currentTime;
  const bufSize=c.sampleRate*0.35;
  const buf=c.createBuffer(1,bufSize,c.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++) d[i]=(Math.random()*2-1)*(1-i/bufSize);
  const src=c.createBufferSource(); src.buffer=buf;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.9;
  bp.frequency.setValueAtTime(600,t0); bp.frequency.exponentialRampToValueAtTime(2400,t0+0.3);
  const g=c.createGain(); g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(.32,t0+0.04); g.gain.exponentialRampToValueAtTime(.001,t0+0.34);
  src.connect(bp); bp.connect(g); g.connect(c.destination); src.start(t0); src.stop(t0+0.36);
}
function chime(){
  if(muted) return;
  const c=ctx(); const t0=c.currentTime;
  [523,659,784].forEach((f,i)=>{
    const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=c.createGain(); g.gain.setValueAtTime(0,t0+i*0.06); g.gain.linearRampToValueAtTime(.12,t0+i*0.06+0.02); g.gain.exponentialRampToValueAtTime(.001,t0+i*0.06+0.5);
    o.connect(g); g.connect(c.destination); o.start(t0+i*0.06); o.stop(t0+i*0.06+0.55);
  });
}
function click(){
  if(muted) return;
  const c=ctx(); const t0=c.currentTime;
  const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(880,t0); o.frequency.exponentialRampToValueAtTime(440,t0+0.08);
  const g=c.createGain(); g.gain.setValueAtTime(.18,t0); g.gain.exponentialRampToValueAtTime(.001,t0+0.09);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+0.1);
}
function alertSound(){
  if(muted) return;
  const c=ctx(); const t0=c.currentTime;
  [0,0.16].forEach(off=>{
    const o=c.createOscillator(); o.type='square'; o.frequency.setValueAtTime(392,t0+off);
    const g=c.createGain(); g.gain.setValueAtTime(0,t0+off); g.gain.linearRampToValueAtTime(.09,t0+off+0.015); g.gain.exponentialRampToValueAtTime(.001,t0+off+0.14);
    o.connect(g); g.connect(c.destination); o.start(t0+off); o.stop(t0+off+0.15);
  });
}

const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="#eee" stroke-width="2"><path d="M4 9v6h4l5 5V4L8 9H4Z"/><path d="M16 9l5 5M21 9l-5 5"/></svg>';
muteBtn.innerHTML=ICON_ON;

function splitWords(container){
  container.querySelectorAll('[data-anim]').forEach(titleEl=>{
    if(!titleEl.dataset.split){
      titleEl.dataset.split='1';
      const walk=(node)=>{
        if(node.nodeType===3){
          const frag=document.createDocumentFragment();
          node.textContent.split(/(\s+)/).forEach(tok=>{
            if(tok.trim()==='') frag.appendChild(document.createTextNode(tok));
            else { const sp=document.createElement('span'); sp.className='word'; sp.textContent=tok; frag.appendChild(sp); }
          });
          node.parentNode.replaceChild(frag,node);
        } else if(node.nodeType===1 && node.childNodes && node.tagName!=='SPAN'){
          Array.from(node.childNodes).forEach(walk);
        }
      };
      Array.from(titleEl.childNodes).forEach(walk);
    }
    let c=0;
    titleEl.querySelectorAll('.word').forEach(w=>{ w.style.animation='none'; void w.offsetWidth; w.style.animationDelay=(c*0.045)+'s'; w.style.animation=''; c++; });
    titleEl.querySelectorAll('.hl').forEach(h=>{ h.style.animation='none'; void h.offsetWidth; h.style.animation=''; });
  });
}
function animateCount(container){
  container.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count), suffix=el.dataset.suffix||'';
    const dur=1000, start=performance.now()+450;
    function tick(now){
      const p=Math.min(1,Math.max(0,(now-start)/dur));
      const ease=1-Math.pow(1-p,3);
      const val=target*ease;
      el.textContent=(target%1===0? Math.round(val): val.toFixed(1))+suffix;
      if(p<1) requestAnimationFrame(tick); else el.textContent=target+suffix;
    }
    requestAnimationFrame(tick);
  });
}
function replayEls(container){
  container.querySelectorAll('.col-card,.chip,.verdict-item,.logo-row .item,.tl-item,.flow-step,.flow-arrow,.recap tr').forEach(el=>{
    const delay=el.style.animationDelay;
    el.style.animation='none'; void el.offsetWidth;
    el.style.animationDelay=delay; el.style.animation='';
  });
}

function render(playSound){
  slideEls.forEach(s=>s.classList.remove('active'));
  const current = slideEls[idx];
  current.classList.add('active');
  splitWords(current); replayEls(current); animateCount(current);

  chapterLabel.textContent = slides[idx].chapter || '';
  slideCounter.textContent = (idx+1)+'/'+slides.length;
  progressFill.style.width = ((idx+1)/slides.length*100)+'%';
  prevBtn.disabled = idx===0; nextBtn.disabled = idx===slides.length-1;

  if(playSound){
    scanEl.classList.remove('play'); void scanEl.offsetWidth; scanEl.classList.add('play');
    if(slides[idx].sound==='alert') alertSound();
    else if(slides[idx].type==='divider') chime();
    else whoosh();
  }
}
prevBtn.addEventListener('click', ()=>{ if(idx>0){idx--; render(true);} });
nextBtn.addEventListener('click', ()=>{ if(idx<slides.length-1){idx++; render(true);} });
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'){ if(idx>0){idx--; render(true);} }
  if(e.key==='ArrowLeft'){ if(idx<slides.length-1){idx++; render(true);} }
});
/* ============ EXTRA MOTION: particles, parallax, stagger, confetti, autoplay, ripple ============ */
(function(){
  const cv=document.createElement('canvas'); cv.id='fx'; stage.insertBefore(cv, stage.querySelector('.slide'));
  const g=cv.getContext('2d'); let W,H,parts=[],burst=[],mx=0,my=0;
  function size(){ W=cv.width=stage.clientWidth; H=cv.height=stage.clientHeight; }
  size(); addEventListener('resize',size);
  for(let i=0;i<46;i++) parts.push({x:Math.random(),y:Math.random(),r:Math.random()*2+.6,s:Math.random()*.00035+.00008,p:Math.random()*6.28,d:Math.random()*.6+.2});
  stage.addEventListener('pointermove',e=>{const b=stage.getBoundingClientRect();mx=(e.clientX-b.left)/b.width-.5;my=(e.clientY-b.top)/b.height-.5;});
  stage.addEventListener('pointerleave',()=>{mx=my=0;});
  let px=0,py=0;
  (function loop(t){
    g.clearRect(0,0,W,H); px+=(mx-px)*.06; py+=(my-py)*.06;
    parts.forEach(p=>{
      p.y-=p.s*16; if(p.y<-.02){p.y=1.02;p.x=Math.random();}
      const x=(p.x+Math.sin(t/2200+p.p)*.012)*W - px*30*p.d, y=p.y*H - py*30*p.d;
      g.beginPath(); g.fillStyle='rgba(255,59,87,'+(.25+.35*Math.sin(t/900+p.p)**2)+')';
      g.shadowColor='#ff3b57'; g.shadowBlur=8; g.arc(x,y,p.r,0,6.28); g.fill();
    });
    g.shadowBlur=0;
    burst=burst.filter(b=>b.l>0); burst.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.18;b.l--;b.a+=b.va;
      g.save();g.translate(b.x,b.y);g.rotate(b.a);g.globalAlpha=Math.min(1,b.l/25);g.fillStyle=b.c;g.fillRect(-b.w/2,-b.w/4,b.w,b.w/2);g.restore();});
    stage.querySelector('.circuit-bg').style.transform='translate('+(-px*14)+'px,'+(-py*10)+'px)';
    requestAnimationFrame(loop);
  })(0);
  window.confetti=function(){
    const cols=['#ff3b57','#c81e3a','#e08a63','#5b9dff','#3ddcb0','#fff'];
    for(let i=0;i<110;i++) burst.push({x:W/2,y:H*.55,vx:(Math.random()-.5)*15,vy:-Math.random()*13-3,l:90+Math.random()*50,a:0,va:(Math.random()-.5)*.4,w:6+Math.random()*7,c:cols[i%cols.length]});
  };
  /* stagger bullet lists */
  window.staggerLis=function(c){ c.querySelectorAll('.col-card').forEach((card,ci)=>{
    card.querySelectorAll('li').forEach((li,i)=>{ li.style.animation='none'; void li.offsetWidth; li.style.animationDelay=(.45+ci*.15+i*.12)+'s'; li.style.animation=''; }); }); };
  /* ripple on buttons */
  document.querySelectorAll('.nav-btn,.icon-btn').forEach(b=>b.addEventListener('click',e=>{
    const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
    d.className='ripple'; d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
    b.appendChild(d); setTimeout(()=>d.remove(),650); }));
  /* autoplay */
  const ab=document.createElement('button'); ab.id='autoBtn'; ab.className='icon-btn'; ab.title='تشغيل تلقائي';
  ab.innerHTML='<svg viewBox="0 0 24 24" fill="#eee"><path d="M8 5v14l11-7z"/></svg>';
  document.querySelector('.controls').insertBefore(ab, document.getElementById('nextBtn').nextSibling);
  let timer=null;
  ab.addEventListener('click',()=>{ if(timer){clearInterval(timer);timer=null;ab.classList.remove('on');return;}
    ab.classList.add('on'); timer=setInterval(()=>{ if(idx<slides.length-1){idx++;render(true);} else {clearInterval(timer);timer=null;ab.classList.remove('on');} },6500); });
})();

/* ============ MOTION GRAPHICS SCENES ============ */
(function(){
  const NS='http://www.w3.org/2000/svg';
  /* persistent ECG heartbeat */
  const pts=[]; for(let x=0;x<1000;x+=250){ pts.push([x,30],[x+60,30],[x+68,35],[x+78,3],[x+88,50],[x+96,30],[x+150,30],[x+158,22],[x+170,22],[x+178,30]); } pts.push([1000,30]);
  const d='M'+pts.map(p=>p.join(' ')).join(' L');
  const ecg=document.createElement('div'); ecg.className='ecg';
  ecg.innerHTML='<svg viewBox="0 0 1000 60" preserveAspectRatio="none" width="100%" height="100%"><path class="base" d="'+d+'"/><path class="beam" pathLength="100" d="'+d+'"/></svg>';
  stage.insertBefore(ecg, stage.querySelector('.slide'));
  /* shutter wipe */
  const wipe=document.createElement('div'); wipe.className='wipe'; wipe.id='wipe';
  wipe.innerHTML=Array.from({length:8},(_,k)=>'<i style="--k:'+k+'"></i>').join('');
  stage.appendChild(wipe);
  /* spotlight */
  stage.addEventListener('pointermove',e=>{const b=stage.getBoundingClientRect();stage.style.setProperty('--mx',((e.clientX-b.left)/b.width*100)+'%');stage.style.setProperty('--my',((e.clientY-b.top)/b.height*100)+'%');});

  function neural(seed){
    let s=seed; const r=()=>(s=(s*16807)%2147483647)/2147483647;
    const layers=[4,6,7,5,3],W=800,H=450;
    const P=layers.map((n,l)=>Array.from({length:n},(_,k)=>({x:60+l*(W-120)/(layers.length-1),y:H/(n+1)*(k+1)+(r()-.5)*16})));
    let e='',n='';
    for(let l=0;l<layers.length-1;l++) P[l].forEach(a=>P[l+1].forEach(b=>{ if(r()<.5) e+='<line class="ne" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" style="animation-delay:-'+(r()*4).toFixed(2)+'s"/>'; }));
    P.flat().forEach(p=>{ n+='<circle class="nn" cx="'+p.x+'" cy="'+p.y+'" r="3.2" style="animation-delay:-'+(r()*3).toFixed(2)+'s"/>'; });
    return '<svg class="neural" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+e+n+'</svg>';
  }
  const sats=[];
  slides.forEach((s,i)=>{
    const el=slideEls[i], h=s.html;
    if(s.type==='intro'||s.type==='outro'){
      el.insertAdjacentHTML('afterbegin',neural(s.type==='intro'?7:13));
      const img=el.querySelector('.logo-hero'), w=document.createElement('div'); w.className='orbit-wrap';
      img.replaceWith(w); w.appendChild(img); w.insertAdjacentHTML('afterbegin','<div class="ell"></div>');
      [LOGO.claude,LOGO.gemini,LOGO.gpt].forEach((lg,k)=>{ const sat=document.createElement('div'); sat.className='sat'; sat.innerHTML=lg; w.appendChild(sat); sats.push({el:sat,ph:k*2.094}); });
    }
    if(s.type==='divider') el.insertAdjacentHTML('afterbegin','<div class="rings"><i></i><i></i><i></i></div>');
    if(h.includes('اتدرب على نصوص')) el.insertAdjacentHTML('afterbegin',neural(21));
    if(h.includes('data-count="66"')){
      const cols=['var(--claude)','var(--gpt)','#a3888c'], vals=[66,63.4,43.7];
      el.querySelectorAll('.col-card').forEach((c,k)=>{
        const st=c.querySelector('.stat'), g=document.createElement('div'); g.className='gauge';
        g.innerHTML='<svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50" pathLength="100"/><circle class="fillc" cx="60" cy="60" r="50" pathLength="100" style="stroke:'+cols[k]+';color:'+cols[k]+';--v:'+vals[k]+'"/></svg>';
        st.replaceWith(g); g.appendChild(st);
      });
    }
    if(h.includes('الديرموسكوبية')){
      const cfg=[[69.8,'var(--claude)',''],[75,'var(--gpt)',''],[50,'var(--gemini)','approx']];
      el.querySelectorAll('.col-card').forEach((c,k)=>{
        c.insertAdjacentHTML('beforeend','<div class="mval '+cfg[k][2]+'" data-count="'+cfg[k][0]+'" data-suffix="%">0%</div><div class="mbar"><i style="--c:'+cfg[k][1]+';--v:'+cfg[k][0]/100+'"></i></div>');
      });
    }
    if(s.sound==='alert') el.querySelector('.alert-box').insertAdjacentHTML('afterbegin','<div class="radar"><i></i><i></i><i></i></div>');
    if(h.includes('class="recap"')) el.querySelectorAll('.recap tr').forEach((tr,k)=>tr.querySelectorAll('td').forEach(td=>td.style.setProperty('--d',(k*0.9-0.9)+'s')));
    if(h.includes('class="recap"')) el.querySelectorAll('.pip').forEach(p=>{ if(p.style.background.includes('accent2')) p.dataset.w='1'; });
  });
  /* orbit animation loop */
  (function orbit(t){
    sats.forEach(o=>{ const a=t/1400+o.ph, c=Math.cos(a), sn=Math.sin(a);
      o.el.style.left=(50+95*c)+'%'; o.el.style.top=(50+28*sn)+'%';
      o.el.style.scale=(1+.3*sn).toFixed(3); o.el.style.zIndex=sn>0?2:0; o.el.style.opacity=(.65+.35*(sn+1)/2).toFixed(2); });
    requestAnimationFrame(orbit);
  })(0);

  window.mgEnter=function(el){
    el.querySelectorAll('.fillc,.mbar i').forEach(x=>{ x.style.animation='none'; void x.offsetWidth; x.style.animation=''; });
    el.style.animation='none'; void el.offsetWidth; el.style.animation='';
    const w=document.getElementById('wipe'); w.classList.remove('play'); void w.offsetWidth; w.classList.add('play');
    const t=document.querySelector('.chapter-tag'); t.classList.remove('swap'); void t.offsetWidth; t.classList.add('swap');
  };
})();

const _render=render;
render=function(ps){ _render(ps); staggerLis(slideEls[idx]); if(ps) mgEnter(slideEls[idx]); if(slides[idx].type==='outro') setTimeout(confetti,500); };
render(false);
</script>
